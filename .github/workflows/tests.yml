name: tests

permissions:
  contents: read

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Assets
        run: npm run build

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Configure Testing Environment
        run: |
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force

      - name: PHP Code Style (Pint)
        run: ./vendor/bin/pint --test

      - name: Code Formatting (Prettier)
        run: npx prettier --check resources/

      - name: Run Tests (Pest)
        run: ./vendor/bin/pest

      - name: Install Chrome for Dusk
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Upgrade Chrome Driver (for Dusk)
        run: php artisan dusk:chrome-driver --detect

      - name: Configure Dusk Environment
        run: |
          APP_KEY=$(php artisan --no-ansi key:show 2>/dev/null || echo "")
          DB_PATH="${{ github.workspace }}/database/database.sqlite"
          printf '%s\n' \
            "APP_NAME=Laravel" \
            "APP_ENV=local" \
            "APP_KEY=${APP_KEY}" \
            "APP_DEBUG=true" \
            "APP_URL=http://127.0.0.1:8000" \
            "DB_CONNECTION=sqlite" \
            "DB_DATABASE=${DB_PATH}" \
            "SESSION_DRIVER=file" \
            "SESSION_LIFETIME=120" \
            "CACHE_STORE=file" \
            "QUEUE_CONNECTION=sync" \
            "MAIL_MAILER=log" \
            "BROADCAST_CONNECTION=log" \
            "FILESYSTEM_DISK=local" \
            "BCRYPT_ROUNDS=4" \
            "VITE_APP_NAME=Laravel" \
            > .env.dusk.local

      - name: Seed Dusk Database
        run: php artisan migrate:fresh --seed --force --env=dusk.local

      - name: Start Chrome Driver
        run: ./vendor/laravel/dusk/bin/chromedriver-linux --port=9515 > /dev/null 2>&1 &

      - name: Start Laravel Server
        run: php artisan serve --env=dusk.local --host=127.0.0.1 --port=8000 > /dev/null 2>&1 &

      - name: Wait for Server
        run: |
          for i in $(seq 1 10); do
            curl -s http://127.0.0.1:8000 > /dev/null && break
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: Run Browser Tests (Dusk)
        run: php artisan dusk --env=dusk.local

      - name: Upload Dusk Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-screenshots
          path: tests/Browser/screenshots
          if-no-files-found: ignore

      - name: Upload Dusk Console Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-console-logs
          path: tests/Browser/console
          if-no-files-found: ignore
